<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Form</title>
</head>
<body>
    <h1>Contact Us</h1>

    <!-- Image Added via URL -->
    <img src="https://www.psdstack.com/wp-content/uploads/2019/08/copyright-free-images-750x420.jpg" alt="Copyright Free Images" width="300">

    <form action="/submit" method="POST">
        <!-- Full Name -->
        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full-name" required><br><br>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Message -->
        <label for="message">Your Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

        <!-- Dropdown Menu (Preferred Contact Method) -->
        <label for="contact-method">Preferred Contact Method:</label>
        <select id="contact-method" name="contact-method" required>
            <option value="">Select a method</option>
            <option value="email">Email</option>
            <option value="phone">Phone</option>
            <option value="chat">Live Chat</option>
        </select><br><br>

        <!-- Submit Button -->
        <button type="submit">Submit</button>
    </form>
</body>
</html>
